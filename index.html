<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조절노트</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* 슬라이더의 원형 노드 및 활성화 알약 바 효과 */
        .slider-pill {
            width: 14px;
            height: 36px;
            border-radius: 99px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="bg-slate-50/30 text-slate-800 min-h-screen pb-12">

    <!-- STREAMING_CHUNK: 헤더 정의하기 -->
    <!-- 상단 헤더 영역 -->
    <header class="max-w-md mx-auto bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100/80 px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                <svg class="inline-block align-[-0.125em] text-lg" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-2 2.8V12a3 3 0 0 0 1.5 2.6A3 3 0 0 0 8 19a3 3 0 0 0 3-3V6a3 3 0 0 0-2-3z"/><path d="M15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 2 2.8V12a3 3 0 0 1-1.5 2.6A3 3 0 0 1 16 19a3 3 0 0 1-3-3V6a3 3 0 0 1 2-3z"/></svg>
            </div>
            <span class="text-lg font-black text-slate-950 tracking-tight">조절노트</span>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-md mx-auto px-4 mt-4">
        
        <!-- STREAMING_CHUNK: 탭 메뉴 렌더링하기 -->
        <!-- 상단 컨트롤 탭 (기록 / 추이변화) -->
        <div class="bg-slate-100 p-1.5 rounded-2xl flex gap-1 mb-5">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-3 text-sm font-black rounded-xl transition-all flex items-center justify-center gap-2 bg-white text-slate-900 shadow-sm">
                <svg class="inline-block align-[-0.125em] text-base" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>기록
            </button>
            <button onclick="switchTab('trend')" id="tab-trend" class="flex-1 py-3 text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800">
                <svg class="inline-block align-[-0.125em] text-base" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M4 19V5"/><polyline points="4 15 9 10 13 13 20 6"/></svg>추이변화
            </button>
        </div>

        <!-- 1. 기록 탭 콘텐츠 -->
        <div id="content-calendar" class="space-y-4">
            
            <!-- STREAMING_CHUNK: 날짜 설정 박스 구현하기 -->
            <!-- 날짜 설정 카드 (image_3aa320.png 참고) -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm/50 relative">
                <label class="text-xs font-bold text-slate-400 block mb-2.5">날짜 설정</label>
                <!-- 투명한 실제 인풋 위에 스타일 레이어를 덮는 스마트 구조 -->
                <div class="relative bg-slate-50/50 border border-slate-100 rounded-2xl p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-colors">
                    <div class="flex items-center gap-2.5">
                        <span id="date-text-display" class="text-base font-black text-slate-900">2026-07-17(금)</span>
                        <span id="today-badge" class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-600 text-[11px] font-black border border-blue-100/50">오늘</span>
                    </div>
                    <svg class="text-slate-400" style="width:1.15em;height:1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
                    <input type="date" id="record-date" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="2026-07-17" onclick="if(this.showPicker){this.showPicker();}">
                </div>
            </div>

            <!-- STREAMING_CHUNK: 1단계 충동강도 카드 그리기 -->
            <!-- 1단계: 충동 강도 -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm/50">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-indigo-50 text-indigo-600 text-xs font-bold flex items-center justify-center">1</span>
                        충동 강도
                    </h3>
                    <span id="label-urge" class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">선택해 주세요</span>
                </div>
                <!-- 커스텀 슬라이더 바 (image_3a936a.png 구조 구현) -->
                <div class="relative py-6 px-1">
                    <!-- 전체 백그라운드 라인 -->
                    <div class="absolute top-1/2 left-0 right-0 h-[4px] bg-slate-100 -translate-y-1/2 rounded-full"></div>
                    <!-- 활성화 채워지는 보라색 라인 -->
                    <div id="track-urge" class="absolute top-1/2 left-0 h-[4px] bg-indigo-500 -translate-y-1/2 rounded-full transition-all duration-300" style="width: 0%;"></div>
                    
                    <!-- 정적 위치 노드 버튼 그룹 -->
                    <div class="relative flex justify-between">
                        <!-- 노드 0 -->
                        <div onclick="setScore('urge', 0)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-urge-0" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">0</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-urge-0">없음</span>
                        </div>
                        <!-- 노드 1 -->
                        <div onclick="setScore('urge', 1)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-urge-1" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">1</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-urge-1">조금</span>
                        </div>
                        <!-- 노드 2 -->
                        <div onclick="setScore('urge', 2)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-urge-2" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">2</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-urge-2">참음</span>
                        </div>
                        <!-- 노드 3 -->
                        <div onclick="setScore('urge', 3)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-urge-3" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">3</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-urge-3">임박/행동</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STREAMING_CHUNK: 2단계 행동여부 카드 그리기 -->
            <!-- 2단계: 행동 여부 -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm/50">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-rose-50 text-rose-600 text-xs font-bold flex items-center justify-center">2</span>
                        행동 여부
                    </h3>
                    <span id="label-action" class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">선택해 주세요</span>
                </div>
                <div class="relative py-6 px-1">
                    <div class="absolute top-1/2 left-0 right-0 h-[4px] bg-slate-100 -translate-y-1/2 rounded-full"></div>
                    <div id="track-action" class="absolute top-1/2 left-0 h-[4px] bg-rose-500 -translate-y-1/2 rounded-full transition-all duration-300" style="width: 0%;"></div>
                    
                    <div class="relative flex justify-between">
                        <!-- 노드 0 -->
                        <div onclick="setScore('action', 0)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-action-0" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">0</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-action-0">없음</span>
                        </div>
                        <!-- 노드 1 -->
                        <div onclick="setScore('action', 1)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-action-1" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">1</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-action-1">생각만</span>
                        </div>
                        <!-- 노드 2 -->
                        <div onclick="setScore('action', 2)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-action-2" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">2</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-action-2">시도/멈춤</span>
                        </div>
                        <!-- 노드 3 -->
                        <div onclick="setScore('action', 3)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-action-3" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">3</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-action-3">실제행동</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STREAMING_CHUNK: 3단계 감정상태 카드 그리기 -->
            <!-- 3단계: 감정 상태 -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm/50">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-amber-50 text-amber-600 text-xs font-bold flex items-center justify-center">3</span>
                        감정 상태
                    </h3>
                    <span id="label-emotion" class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">선택해 주세요</span>
                </div>
                <div class="relative py-6 px-1">
                    <div class="absolute top-1/2 left-0 right-0 h-[4px] bg-slate-100 -translate-y-1/2 rounded-full"></div>
                    <div id="track-emotion" class="absolute top-1/2 left-0 h-[4px] bg-amber-500 -translate-y-1/2 rounded-full transition-all duration-300" style="width: 0%;"></div>
                    
                    <div class="relative flex justify-between">
                        <!-- 노드 0 -->
                        <div onclick="setScore('emotion', 0)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-emotion-0" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">0</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-emotion-0">안정</span>
                        </div>
                        <!-- 노드 1 -->
                        <div onclick="setScore('emotion', 1)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-emotion-1" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">1</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-emotion-1">약간불안</span>
                        </div>
                        <!-- 노드 2 -->
                        <div onclick="setScore('emotion', 2)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-emotion-2" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">2</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-emotion-2">불안큼</span>
                        </div>
                        <!-- 노드 3 -->
                        <div onclick="setScore('emotion', 3)" class="relative flex flex-col items-center cursor-pointer w-10">
                            <div id="node-emotion-3" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all">3</div>
                            <span class="text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap" id="text-emotion-3">폭발</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STREAMING_CHUNK: 4단계 부작용 카드 그리기 -->
            <!-- 4단계: 부작용 (일관된 카드 디자인) -->
            <div class="bg-slate-50/50 p-5 rounded-2xl border border-slate-100">
                <div class="flex items-center gap-2 mb-4">
                    <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center">4</span>
                    <h3 class="text-base font-black text-slate-900">부작용 <span class="text-xs text-slate-400 font-normal ml-1">(중복 선택 가능)</span></h3>
                </div>
                <div class="grid grid-cols-2 gap-2.5" id="side-effects-container">
                    <button onclick="toggleSideEffect('메스꺼움')" id="eff-메스꺼움" class="py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50">메스꺼움</button>
                    <button onclick="toggleSideEffect('졸림')" id="eff-졸림" class="py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50">졸림</button>
                    <button onclick="toggleSideEffect('식욕증가')" id="eff-식욕증가" class="py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50">식욕증가</button>
                    <button onclick="toggleSideEffect('식욕감소')" id="eff-식욕감소" class="py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50">식욕감소</button>
                </div>
            </div>

            <!-- STREAMING_CHUNK: 5단계 메모 카드 그리기 -->
            <!-- 5단계: 메모 (일관된 카드 디자인) -->
            <div class="bg-slate-50/50 p-5 rounded-2xl border border-slate-100">
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center">5</span>
                    <h3 class="text-base font-black text-slate-900">메모</h3>
                </div>
                <textarea id="memo-input" class="w-full h-24 p-3.5 bg-white border border-slate-200/80 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all resize-none" placeholder="당시의 상황이나 생각을 간단히 적어보세요."></textarea>
            </div>

            <!-- 저장하기 버튼 -->
            <button onclick="saveRecord()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-base shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2 mt-4 active:scale-95">
                <svg class="inline-block align-[-0.125em]" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v4h6V4"/><rect x="7" y="13" width="10" height="6"/></svg>저장하기
            </button>

            <!-- STREAMING_CHUNK: 최근 저장 리스트 정의하기 -->
            <!-- 최근 저장된 기록 목록 (3일치 한정) -->
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm/50" style="margin-top: 28px;">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-black text-slate-950 flex items-center gap-2">
                        <svg class="inline-block align-[-0.125em] text-indigo-500" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5 6 5 7.5 7.5 5"/><line x1="11" y1="6" x2="21" y2="6"/><polyline points="3.5 12 5 13.5 7.5 11"/><line x1="11" y1="12" x2="21" y2="12"/><polyline points="3.5 18 5 19.5 7.5 17"/><line x1="11" y1="18" x2="21" y2="18"/></svg>최근 저장된 기록 <span class="text-xs text-indigo-600 font-black" id="history-count">0건</span>
                    </h3>
                </div>
                <!-- 3일치 피드 리스트 컨테이너 -->
                <div id="history-container" class="space-y-3.5">
                    <!-- JS에서 3일치 렌더링 -->
                </div>
            </div>

        </div>

        <!-- STREAMING_CHUNK: 2. 추이변화 탭 콘텐츠 그리기 -->
        <!-- 2. 추이변화 탭 콘텐츠 -->
        <div id="content-trend" class="space-y-4 hidden">
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm/50">
                <div class="mb-4">
                    <h3 class="text-base font-black text-slate-950 flex items-center gap-2">
                        <svg class="inline-block align-[-0.125em] text-indigo-500" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M4 19V5"/><polyline points="4 15 9 10 13 13 20 6"/></svg>날짜별 변화
                    </h3>
                    <p class="text-[11px] text-slate-400 font-medium mt-1">상단의 기록 데이터를 기반으로 변동성이 자동 시각화됩니다.</p>
                </div>
                <!-- 차트 영역 (플레이스홀더를 제거하여 언제나 눈금과 날짜 축이 보이도록 유도) -->
                <div class="relative min-h-[260px] flex items-center justify-center">
                    <canvas id="trendChart" class="w-full h-full max-h-[300px]"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- STREAMING_CHUNK: 공통 토스트 및 알림 모달창 마크업 -->
    <!-- 1. 커스텀 모달 대화상자 (삭제 확인 전용) -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center px-4 transition-opacity duration-200 opacity-0 pointer-events-none">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl border border-slate-100/50 transform scale-95 transition-transform duration-200">
            <div id="modal-icon-bg" class="w-12 h-12 rounded-full flex items-center justify-center mb-4 text-xl">
                <!-- 아이콘 -->
            </div>
            <h4 id="modal-title" class="text-base font-black text-slate-950 mb-1.5"></h4>
            <p id="modal-desc" class="text-xs text-slate-500 leading-relaxed mb-6"></p>
            <div class="flex gap-2.5">
                <button onclick="closeModal()" class="flex-1 py-3 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200/80 rounded-xl transition-all">취소</button>
                <button id="modal-confirm-btn" class="flex-1 py-3 text-xs font-black text-white rounded-xl transition-all">확인</button>
            </div>
        </div>
    </div>

    <!-- 2. 커스텀 토스트 알림 메시지 상자 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white py-3 px-5 rounded-2xl shadow-xl flex items-center gap-2.5 z-50 text-xs font-bold transition-all duration-300 translate-y-12 opacity-0 pointer-events-none">
        <span id="toast-icon"></span>
        <span id="toast-text"></span>
    </div>

    <!-- STREAMING_CHUNK: 비즈니스 자바스크립트 로직 안전 기술 -->
    <script>
        // 전역 상태 변수들
        let activeTab = 'calendar';
        let records = {};
        
        // 현재 작성 중인 폼 임시 모델 (기본값 완벽 비우기)
        let currentRecord = {
            urge: null,
            action: null,
            emotion: null,
            sideEffects: [],
            memo: ''
        };

        let chartInstance = null;
        let targetDeleteDate = null; // 삭제 대기 날짜

        // 최초 로드 시 초기 데이터 셋팅
        window.onload = function() {
            // 오늘 날짜 기본 지정 (2026-07-17 기준)
            const defaultDate = '2026-07-17';
            document.getElementById('record-date').value = defaultDate;

            // 로컬스토리지에서 복구 (가상 샘플 데이터 없이 완벽하게 깨끗한 빈 상태로 시작)
            if (!localStorage.getItem('control_notes_data')) {
                localStorage.setItem('control_notes_data', JSON.stringify({}));
            }
            loadRecords();

            renderHistory();
            updateDateDisplay(defaultDate);
            
            // 날짜 변경 이벤트 연동
            document.getElementById('record-date').addEventListener('change', function() {
                updateDateDisplay(this.value);
                loadExistingRecord(this.value);
            });

            // 초기 날짜 로드
            loadExistingRecord(defaultDate);
        };

        // 로컬스토리지 데이터 로드
        function loadRecords() {
            try {
                const data = localStorage.getItem('control_notes_data');
                records = data ? JSON.parse(data) : {};
            } catch(e) {
                records = {};
            }
        }

        // 날짜에 따른 한글 요일 및 "오늘" 배지 표시 업데이트 (image_3aa320.png 양식)
        function updateDateDisplay(dateStr) {
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateObj = new Date(dateStr);
            const dayOfWeek = days[dateObj.getDay()];
            
            // 날짜와 요일 텍스트 조합 (요일 포함)
            const formattedText = `${dateStr}(${dayOfWeek})`;
            document.getElementById('date-text-display').textContent = formattedText;

            // 2026-07-17이 오늘 기준이므로, 해당 날짜일 때 파란색 '오늘' 배지 노출
            const badge = document.getElementById('today-badge');
            if (dateStr === '2026-07-17') {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // 커스텀 슬라이더 노드 선택 이벤트 핸들러 (image_3a936a.png 시각 반응)
        function setScore(type, score) {
            currentRecord[type] = score;

            // 라벨 문구 및 트랙 퍼센트 계산
            const labels = {
                urge: ['0점 (없음)', '1점 (조금)', '2점 (참음)', '3점 (임박/행동)'],
                action: ['0점 (없음)', '1점 (생각만)', '2점 (시도/멈춤)', '3점 (실제행동)'],
                emotion: ['0점 (안정)', '1점 (약간불안)', '2점 (불안큼)', '3점 (폭발)']
            };

            const trackColors = {
                urge: 'bg-indigo-500',
                action: 'bg-rose-500',
                emotion: 'bg-amber-500'
            };

            // 활성화 라벨 텍스트 적용
            document.getElementById(`label-${type}`).textContent = labels[type][score];

            // 트랙 채우기 (0~3 척도 계산)
            const percent = (score / 3) * 100;
            document.getElementById(`track-${type}`).style.width = `${percent}%`;

            // 모든 노드에 대한 초기화 후 활성 원형 캡슐 효과 부여
            for (let i = 0; i <= 3; i++) {
                const node = document.getElementById(`node-${type}-${i}`);
                const labelText = document.getElementById(`text-${type}-${i}`);
                
                // 기존 활성화 클래스 리셋
                node.className = "w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all";
                labelText.className = "text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap";

                if (i === score) {
                    // 선택된 값은 아름다운 입체 캡슐 알약 형태로 전환 (image_3a936a.png 구현)
                    node.className = `slider-pill w-4.5 h-10 -mt-2 rounded-full flex items-center justify-center z-20 border-2 border-white text-[0px] ${trackColors[type]}`;
                    labelText.className = `text-[13px] font-black mt-3.5 transition-colors text-slate-900 whitespace-nowrap`;
                }
            }
        }

        // 부작용 복수 선택 토글
        function toggleSideEffect(name) {
            const index = currentRecord.sideEffects.indexOf(name);
            const btn = document.getElementById(`eff-${name}`);

            if (index > -1) {
                currentRecord.sideEffects.splice(index, 1);
                btn.className = "py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50";
            } else {
                currentRecord.sideEffects.push(name);
                btn.className = "py-3 px-4 rounded-xl bg-emerald-500 border border-emerald-500 text-sm font-black text-white transition-all shadow-sm shadow-emerald-100";
            }
        }

        // 기존에 해당 날짜 기록이 있다면 복구해서 불러오기
        function loadExistingRecord(dateStr) {
            loadRecords();
            const record = records[dateStr];

            if (record) {
                setScore('urge', record.urge);
                setScore('action', record.action);
                setScore('emotion', record.emotion);
                
                currentRecord.sideEffects = [];
                const possibleEffects = ['메스꺼움', '졸림', '식욕증가', '식욕감소'];
                possibleEffects.forEach(eff => {
                    const btn = document.getElementById(`eff-${eff}`);
                    btn.className = "py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50";
                });

                if (record.sideEffects && Array.isArray(record.sideEffects)) {
                    record.sideEffects.forEach(eff => toggleSideEffect(eff));
                }

                document.getElementById('memo-input').value = record.memo || '';
                currentRecord.memo = record.memo || '';
            } else {
                clearInputForm();
            }
        }

        // 폼 전체 원상 초기화
        function clearInputForm() {
            currentRecord = { urge: null, action: null, emotion: null, sideEffects: [], memo: '' };
            
            ['urge', 'action', 'emotion'].forEach(type => {
                document.getElementById(`label-${type}`).textContent = "선택해 주세요";
                document.getElementById(`track-${type}`).style.width = `0%`;
                
                for (let i = 0; i <= 3; i++) {
                    const node = document.getElementById(`node-${type}-${i}`);
                    const labelText = document.getElementById(`text-${type}-${i}`);
                    node.className = "w-6 h-6 rounded-full bg-white border-2 border-slate-200 text-[10px] text-slate-400 font-extrabold flex items-center justify-center z-10 transition-all";
                    labelText.className = "text-[13px] font-extrabold text-slate-400 mt-3.5 transition-colors whitespace-nowrap";
                }
            });

            const possibleEffects = ['메스꺼움', '졸림', '식욕증가', '식욕감소'];
            possibleEffects.forEach(eff => {
                document.getElementById(`eff-${eff}`).className = "py-3 px-4 rounded-xl bg-white border border-slate-200/80 text-sm font-bold text-slate-700 transition-all hover:bg-slate-50";
            });

            document.getElementById('memo-input').value = '';
        }

        // 기록 저장 프로세스
        function saveRecord() {
            const dateStr = document.getElementById('record-date').value;
            if (!dateStr) {
                showToast('❌ 날짜를 정확히 선택해 주세요.', 'error');
                return;
            }

            if (currentRecord.urge === null || currentRecord.action === null || currentRecord.emotion === null) {
                showToast('💡 1, 2, 3단계의 척도를 반드시 눌러 선택해 주세요.', 'info');
                return;
            }

            loadRecords();
            records[dateStr] = {
                urge: currentRecord.urge,
                action: currentRecord.action,
                emotion: currentRecord.emotion,
                sideEffects: [...currentRecord.sideEffects],
                memo: document.getElementById('memo-input').value.trim()
            };

            localStorage.setItem('control_notes_data', JSON.stringify(records));
            showToast('✅ 조절노트가 안전하게 저장되었습니다.', 'success');
            
            loadExistingRecord(dateStr);
            renderHistory();
        }

        // 최근 기록 3일치 목록 그리기
        function renderHistory() {
            const container = document.getElementById('history-container');
            const countLabel = document.getElementById('history-count');
            
            loadRecords();

            const sortedDates = Object.keys(records).sort((a, b) => new Date(b) - new Date(a));
            countLabel.textContent = `${sortedDates.length}건`;

            if (sortedDates.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 px-4 border-2 border-dashed border-slate-100 rounded-3xl bg-slate-50/30">
                        <svg class="inline-block align-[-0.125em] text-3xl text-slate-300 mb-2.5 block" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H5"/><path d="M3 9l1.5 9.5A2 2 0 0 0 6.5 20h11a2 2 0 0 0 2-1.5L21 9.5"/></svg>
                        <p class="text-xs font-bold text-slate-400">저장된 기록이 없습니다.</p>
                        <p class="text-[10px] text-slate-400 mt-1">상단의 슬라이더를 통해 하루를 조율해 보세요.</p>
                    </div>
                `;
                return;
            }

            // 최신 3일치만 필터링하여 노출
            const limitedDates = sortedDates.slice(0, 3);

            container.innerHTML = limitedDates.map(date => {
                const item = records[date];
                
                const urgeColors = ['bg-slate-100 text-slate-700', 'bg-indigo-50 text-indigo-700 border border-indigo-100', 'bg-amber-50 text-amber-800 border border-amber-200 font-bold', 'bg-rose-50 text-rose-700 border border-rose-100 font-black'];
                const urgeTexts = ['없음', '조금', '참음', '임박/행동'];

                const actionColors = ['bg-slate-100 text-slate-700', 'bg-slate-50 text-slate-600', 'bg-amber-50 text-amber-800 border border-amber-100 font-bold', 'bg-rose-50 text-rose-700 border border-rose-150 font-black'];
                const actionTexts = ['없음', '생각만', '시도/멈춤', '실제행동'];

                const emotionColors = ['bg-slate-100 text-slate-700', 'bg-slate-50 text-slate-600', 'bg-amber-50 text-amber-700 border border-amber-100 font-bold', 'bg-rose-50 text-rose-700 border border-rose-150 font-black'];
                const emotionTexts = ['안정', '약간불안', '불안큼', '폭발'];

                const sideEffectsHtml = item.sideEffects && item.sideEffects.length > 0 
                    ? item.sideEffects.map(ef => `<span class="inline-flex items-center px-2 py-1 rounded text-[10px] font-black bg-emerald-50 text-emerald-700 border border-emerald-100"><svg class="inline-block align-[-0.125em] mr-1 text-[8px]" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="13"/><circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/></svg>${ef}</span>`).join('')
                    : '';

                return `
                    <div class="bg-white border border-slate-150 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow relative group">
                        
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-black text-slate-900 bg-slate-100 px-2.5 py-1.5 rounded-md flex items-center">
                                <svg class="inline-block align-[-0.125em] text-[10px] text-slate-500 mr-1.5" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>${date}
                            </span>
                            <button onclick="askDeleteHistoryItem('${date}')" class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 transition-all text-xs" title="삭제">
                                <svg class="inline-block align-[-0.125em] text-sm" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
                            </button>
                        </div>

                        <div class="grid grid-cols-3 gap-2 mb-3 text-center">
                            <div class="p-2 rounded-lg bg-slate-50 border border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 mb-1">충동</p>
                                <span class="text-[10px] px-1.5 py-1 rounded ${urgeColors[item.urge]}">${item.urge} (${urgeTexts[item.urge]})</span>
                            </div>
                            <div class="p-2 rounded-lg bg-slate-50 border border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 mb-1">행동</p>
                                <span class="text-[10px] px-1.5 py-1 rounded ${actionColors[item.action]}">${item.action} (${actionTexts[item.action]})</span>
                            </div>
                            <div class="p-2 rounded-lg bg-slate-50 border border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 mb-1">감정</p>
                                <span class="text-[10px] px-1.5 py-1 rounded ${emotionColors[item.emotion]}">${item.emotion} (${emotionTexts[item.emotion]})</span>
                            </div>
                        </div>

                        ${sideEffectsHtml ? `<div class="flex flex-wrap gap-1 mb-2.5">${sideEffectsHtml}</div>` : ''}
                        ${item.memo ? `<div class="bg-slate-50 p-2.5 rounded-lg border-l-2 border-indigo-400 text-xs text-slate-600 italic leading-relaxed">"${item.memo}"</div>` : ''}

                    </div>
                `;
            }).join('');
        }

        // 토스트 팝업 메세지 실행기
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-text');

            text.textContent = message;
            
            if (type === 'success') {
                icon.innerHTML = `<svg class="inline-block align-[-0.125em] text-emerald-400 text-sm" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 10.8 15 16 9.5"/></svg>`;
            } else if (type === 'info') {
                icon.innerHTML = `<svg class="inline-block align-[-0.125em] text-sky-400 text-sm" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.5" r="0.9" fill="currentColor" stroke="none"/></svg>`;
            } else {
                icon.innerHTML = `<svg class="inline-block align-[-0.125em] text-rose-400 text-sm" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="13"/><circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/></svg>`;
            }

            toast.classList.remove('opacity-0', 'translate-y-12', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-12', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2300);
        }

        // 커스텀 모달 노출 처리
        function openModal(title, desc, confirmCallback, iconHtml, iconBgClass) {
            const modal = document.getElementById('custom-modal');
            const modalBox = modal.querySelector('div');
            
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;

            const iconBg = document.getElementById('modal-icon-bg');
            iconBg.className = `w-12 h-12 rounded-full flex items-center justify-center mb-4 text-xl ${iconBgClass}`;
            iconBg.innerHTML = iconHtml;

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.className = `flex-1 py-3 text-xs font-black text-white rounded-xl transition-all ${iconBgClass.split(' ')[0]} hover:brightness-95`;
            
            const newConfirmBtn = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            
            newConfirmBtn.addEventListener('click', () => {
                confirmCallback();
                closeModal();
            });

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-95');
            modalBox.classList.add('scale-100');
        }

        // 모달 닫기
        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const modalBox = modal.querySelector('div');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
        }

        // 특정 기록 단건 삭제 팝업 물어보기
        function askDeleteHistoryItem(date) {
            targetDeleteDate = date;
            openModal(
                '기록 삭제',
                `${date}의 조절 기록을 기기에서 완전히 삭제하시겠습니까? 삭제 후에는 복구할 수 없습니다.`,
                confirmDelete,
                '<svg class="inline-block align-[-0.125em]" style="width:1em;height:1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>',
                'bg-rose-500 text-white shadow-md shadow-rose-100'
            );
        }

        function confirmDelete() {
            if (!targetDeleteDate) return;
            loadRecords();
            delete records[targetDeleteDate];
            localStorage.setItem('control_notes_data', JSON.stringify(records));
            showToast('🗑️ 해당 날짜의 기록이 삭제되었습니다.', 'info');
            
            const currentDate = document.getElementById('record-date').value;
            loadExistingRecord(currentDate);
            renderHistory();
            targetDeleteDate = null;
        }

        // 탭 버튼 스위칭
        function switchTab(tabName) {
            if (activeTab === tabName) return;
            activeTab = tabName;

            const tabCal = document.getElementById('tab-calendar');
            const tabTrend = document.getElementById('tab-trend');
            const contentCal = document.getElementById('content-calendar');
            const contentTrend = document.getElementById('content-trend');

            if (tabName === 'calendar') {
                tabCal.className = "flex-1 py-3 text-sm font-black rounded-xl transition-all flex items-center justify-center gap-2 bg-white text-slate-900 shadow-sm";
                tabTrend.className = "flex-1 py-3 text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800";
                contentCal.classList.remove('hidden');
                contentTrend.classList.add('hidden');
                renderHistory();
            } else {
                tabTrend.className = "flex-1 py-3 text-sm font-black rounded-xl transition-all flex items-center justify-center gap-2 bg-white text-slate-900 shadow-sm";
                tabCal.className = "flex-1 py-3 text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800";
                contentCal.classList.add('hidden');
                contentTrend.classList.remove('hidden');
                renderChart();
            }
        }

        // Chart.js 그래프 그리기
        function renderChart() {
            loadRecords();
            
            let chartLabels = [];
            let urgeScores = [];
            let actionScores = [];
            let emotionScores = [];

            const sortedDates = Object.keys(records).sort((a, b) => new Date(a) - new Date(b));

            if (sortedDates.length === 0) {
                // 데이터가 완전히 없더라도 최근 7일(2026-07-17 기준)의 날짜 가로축은 온전하게 출력하도록 보완
                const baseDate = new Date('2026-07-17');
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(baseDate);
                    d.setDate(baseDate.getDate() - i);
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    chartLabels.push([`${mm}/${dd}`, '', '']);
                    urgeScores.push(null);
                    actionScores.push(null);
                    emotionScores.push(null);
                }
            } else {
                // 저장 데이터가 있을 때 최근 7일 필터링 및 대입
                const last7Days = sortedDates.slice(-7);
                chartLabels = last7Days.map(date => {
                    const parts = date.split('-');
                    const dateLabel = `${parts[1]}/${parts[2]}`; // "MM/DD" 포맷팅
                    const item = records[date];
                    const sideEffectsLine = item.sideEffects && item.sideEffects.length > 0 ? item.sideEffects.join(', ') : '';
                    const memoLine = item.memo && item.memo.trim() ? item.memo : '';
                    return [dateLabel, sideEffectsLine, memoLine];
                });
                urgeScores = last7Days.map(date => records[date].urge);
                actionScores = last7Days.map(date => records[date].action);
                emotionScores = last7Days.map(date => records[date].emotion);
            }

            const canvas = document.getElementById('trendChart');
            
            // Canvas is already in use 중복 에러 차단을 위해 기존 활성 객체 탐색 후 파괴
            const existingChart = Chart.getChart(canvas);
            if (existingChart) {
                existingChart.destroy();
            }

            const ctx = canvas.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: '충동 강도',
                            data: urgeScores,
                            borderColor: '#6366f1', // Indigo
                            backgroundColor: 'rgba(99, 102, 241, 0.05)',
                            tension: 0.35,
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#6366f1',
                            fill: true
                        },
                        {
                            label: '행동 여부',
                            data: actionScores,
                            borderColor: '#f43f5e', // Rose
                            backgroundColor: 'rgba(244, 63, 94, 0.05)',
                            tension: 0.35,
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#f43f5e',
                            fill: true
                        },
                        {
                            label: '감정 상태',
                            data: emotionScores,
                            borderColor: '#f59e0b', // Amber
                            backgroundColor: 'rgba(245, 158, 11, 0.05)',
                            tension: 0.35,
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#f59e0b',
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    clip: false,
                    layout: {
                        padding: { top: 10, bottom: 10 }
                    },
                    scales: {
                        y: {
                            min: 0,
                            max: 3,
                            grid: { color: '#f1f5f9' },
                            ticks: {
                                stepSize: 1,
                                font: { size: 10, weight: '700' },
                                color: '#94a3b8'
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: {
                                font: { size: 10, weight: '700' },
                                color: '#94a3b8'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 8,
                                boxHeight: 8,
                                padding: 16,
                                font: { size: 11, weight: '700' },
                                color: '#475569'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
